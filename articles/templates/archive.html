{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Архив статей</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}" />
  </head>
  <body class="archive">
    <div class="header" style="position: relative">
      <h1>Мой блог</h1>
      <div class="auth-links">
        {% if user.is_authenticated %}
        <span>Привет, {{ user.username }}!</span> |
        <a href="{% url 'create_post' %}" class="add-post-btn"
          >+ Добавить статью</a
        >
        {% else %}
        <a href="{% url 'register' %}" class="auth-link">Регистрация</a> |
        <a href="{% url 'login' %}" class="auth-link">Войти</a>
        {% endif %}
      </div>
    </div>

    <div class="archive">
      {% for post in posts %}
      <div class="one-post">
        <h2 class="post-title">
          <a href="{% url 'get_article' post.id %}">{{ post.title }}</a>
        </h2>
        <div class="article-info">
          <div class="article-author">{{ post.author.username }}</div>
          <div class="article-created-date">{{ post.created_date }}</div>
        </div>
        <p class="article-text">{{ post.get_excerpt }}</p>
        <button class="fold-button">свернуть</button>
      </div>
      {% endfor %}
    </div>
  </body>
  <script src="{% static 'js/helloworld.js' %}"></script>
  <script src="{% static 'js/fold-post.js' %}"></script>
</html>
