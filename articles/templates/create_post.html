{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Создать статью</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}" />
  </head>
  <body class="archive">
    <div class="archive">
      <h1>Написать статью</h1>
      <form method="POST">
        {% csrf_token %}
        <input
          type="text"
          name="title"
          placeholder="Название статьи"
          value="{{ form.title }}"
          style="width: 100%; padding: 10px; margin-bottom: 10px"
        />
        <textarea
          name="text"
          placeholder="Текст статьи"
          style="width: 100%; height: 200px; padding: 10px; margin-bottom: 10px"
        >
{{ form.text }}</textarea
        >
        <input
          type="submit"
          value="Сохранить"
          style="padding: 10px 20px; cursor: pointer"
        />
      </form>
      <p style="color: red; font-weight: bold">{{ form.errors }}</p>
    </div>
  </body>
</html>
